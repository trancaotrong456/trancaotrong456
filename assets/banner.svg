<svg width="1000" height="240" viewBox="0 0 1000 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1e" />
      <stop offset="50%" stop-color="#0d1526" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="240" rx="16" fill="url(#bgGrad)" />
  <rect width="1000" height="240" rx="16" stroke="#2dd4bf" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Ambient Glow Circles -->
  <circle cx="150" cy="40" r="100" fill="url(#glowGrad1)" filter="url(#blurFilter)" />
  <circle cx="850" cy="200" r="120" fill="url(#glowGrad2)" filter="url(#blurFilter)" />

  <!-- Subtle Grid Dots Pattern -->
  <g fill="#2dd4bf" opacity="0.08">
    <circle cx="50" cy="50" r="1.5" /><circle cx="90" cy="50" r="1.5" /><circle cx="130" cy="50" r="1.5" />
    <circle cx="50" cy="90" r="1.5" /><circle cx="90" cy="90" r="1.5" /><circle cx="130" cy="90" r="1.5" />
    <circle cx="870" cy="50" r="1.5" /><circle cx="910" cy="50" r="1.5" /><circle cx="950" cy="50" r="1.5" />
    <circle cx="870" cy="90" r="1.5" /><circle cx="910" cy="90" r="1.5" /><circle cx="950" cy="90" r="1.5" />
    <circle cx="870" cy="130" r="1.5" /><circle cx="910" cy="130" r="1.5" /><circle cx="950" cy="130" r="1.5" />
  </g>

  <!-- Tag Pill -->
  <rect x="500" y="38" width="170" height="28" rx="14" fill="#2dd4bf" fill-opacity="0.1" stroke="#2dd4bf" stroke-opacity="0.3" transform="translate(-85, 0)" />
  <text x="500" y="56" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="middle" letter-spacing="1.5">FULL STACK DEVELOPER</text>

  <!-- Main Name Title -->
  <text x="500" y="125" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" text-anchor="middle" letter-spacing="1">Trần Cao Trọng</text>

  <!-- Subtitle -->
  <text x="500" y="165" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">PHP • Laravel • C# • .NET 9 • Web &amp; Desktop Software</text>

  <!-- Bottom Accent Divider Line -->
  <rect x="350" y="195" width="300" height="3" rx="1.5" fill="url(#accentGrad)" />
</svg>
